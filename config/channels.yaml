  - identifier: "@indiannavy_updates"
    display_name: "Indian Maritime & Naval Tech"
    topic_tags: ["navy", "maritime", "indigenous_ships", "defense"]
    notes: "Naval shipbuilding, maritime surveillance, and carrier tech"

  - identifier: "@iaf_updates_hub"
    display_name: "Indian Air Force Aviation Hub"
    topic_tags: ["airforce", "aviation", "fighters", "defense"]
    notes: "Air defense, radar installations, and aerospace tests"

  - identifier: "@criticaltech_india"
    display_name: "Critical Technologies Watch"
    topic_tags: ["technology", "space", "defense", "critical_minerals"]
